<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OmniStock WMS</title>
  <script>
    // GitHub Pages project sites may request a deep URL directly.
    // Send it back to the app entry point; the app itself uses hash-free
    // internal state, so no server-side route is required.
    (function () {
      var path = window.location.pathname;
      var parts = path.split('/').filter(Boolean);
      var repoRoot = parts.length ? '/' + parts[0] + '/' : '/';
      window.location.replace(repoRoot);
    })();
  </script>
</head>
<body>Loading OmniStock…</body>
</html>
